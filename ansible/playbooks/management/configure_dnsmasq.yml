# Conceptually:
# 
# Ansible
#    |
#    +-- install dnsmasq
#    |
#    +-- /etc/dnsmasq.d/lab.conf
#    |
#    +-- /etc/dnsmasq/lab.hosts
#    |
#    +-- /etc/dnsmasq.d/reverse.conf
#    |
#    +-- validate
#    |
#    +-- restart
#    |
#    +-- DNS test

# The playbook below will:

# Install dnsmasq
# Create /etc/dnsmasq
# Configure forward DNS/local hosts
# Configure reverse DNS
# Validate the dnsmasq configuration
# Enable and start dnsmasq
# Restart it only when configuration changes

---
- name: Configure dnsmasq DNS server
  hosts: ubuntu-mgmt
  become: true
  gather_facts: false

  handlers:
    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted

  tasks:
    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present
        update_cache: true

    - name: Create dnsmasq hosts directory
      ansible.builtin.file:
        path: /etc/dnsmasq
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure dnsmasq
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/lab.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          listen-address=10.0.30.50
          bind-interfaces
          domain=lab.local
          local=/lab.local/
          server=1.1.1.1
          server=8.8.8.8
          addn-hosts=/etc/dnsmasq/lab.hosts
        notify: Restart dnsmasq

    - name: Configure forward DNS records
      ansible.builtin.copy:
        dest: /etc/dnsmasq/lab.hosts
        owner: root
        group: root
        mode: '0644'
        content: |
          10.0.30.2    dist-1.lab.local
          10.0.30.3    dist-2.lab.local
          10.0.30.11   access-1.lab.local
          10.0.30.12   access-2.lab.local
          10.0.30.21   mgmt-1.lab.local
          10.0.30.22   mgmt-2.lab.local
          10.0.30.50   ubuntu-mgmt.lab.local
          10.0.30.101  core-1.lab.local
          10.0.30.102  core-2.lab.local
          10.0.30.201  fw-1.lab.local
        notify: Restart dnsmasq

    - name: Configure reverse DNS records
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/reverse.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          ptr-record=2.30.0.10.in-addr.arpa,dist-1.lab.local
          ptr-record=3.30.0.10.in-addr.arpa,dist-2.lab.local
          ptr-record=11.30.0.10.in-addr.arpa,access-1.lab.local
          ptr-record=12.30.0.10.in-addr.arpa,access-2.lab.local
          ptr-record=21.30.0.10.in-addr.arpa,mgmt-1.lab.local
          ptr-record=22.30.0.10.in-addr.arpa,mgmt-2.lab.local
          ptr-record=50.30.0.10.in-addr.arpa,ubuntu-mgmt.lab.local
          ptr-record=101.30.0.10.in-addr.arpa,core-1.lab.local
          ptr-record=102.30.0.10.in-addr.arpa,core-2.lab.local
          ptr-record=201.30.0.10.in-addr.arpa,fw-1.lab.local
        notify: Restart dnsmasq

    - name: Validate dnsmasq configuration
      ansible.builtin.command:
        cmd: dnsmasq --test
      changed_when: false

    - name: Enable and start dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started
