---
- name: Configure banners on Cisco IOS devices
  hosts: ios_devices
  gather_facts: false

  tasks:
    - name: Configure login banner
      cisco.ios.ios_banner:
        banner: login
        text: "{{ login_banner }}"
        state: present

    - name: Configure exec banner
      cisco.ios.ios_banner:
        banner: exec
        text: "{{ exec_banner }}"
        state: present

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified

