---
- name: Configure syslog on core routers
  hosts: core
  gather_facts: false

  tasks:

    - name: Configure syslog server
      cisco.ios.ios_logging_global:
        config:
          hosts:
            - host: "{{ syslog_server }}"
              transport:
                udp:
                  port: 514
      notify: Save configuration

    - name: Configure syslog source interface
      cisco.ios.ios_config:
        lines:
          - "logging source-interface {{ syslog_source_interface }}"
      notify: Save configuration

  handlers:

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified

